# English catalog (source language). Every key here must also exist in tr.toml (guarded by i18n_test).
# Placeholders are written {name}; avoid sentences that need plural forms.

[error]
invalid_path = "Invalid path '{path}': {reason}"
io = "I/O error at '{path}': {detail}"
not_found = "Not found: {path}"
already_exists = "Already exists: {path}"
modified_externally = "Modified outside the app since it was opened: {path}"
not_empty = "Folder is not empty: {path}"
config_invalid = "Invalid configuration: {detail}"
editor_not_found = "No editor found (tried: {candidates})"
editor_failed = "Editor '{editor}' failed with exit code {code}"
process_not_found = "Program not found: {program}"
process_spawn_failed = "Could not start '{program}': {reason}"
process_unsafe_argument = "Argument rejected because it contains characters that are unsafe for cmd.exe: {argument}"
process_empty_command = "The command is empty"

[reason]
empty = "path is empty"
invalid_utf8 = "not valid UTF-8"
unc = "network (UNC) paths are not allowed"
backslash = "use '/' as the separator, not '\\'"
absolute = "must be relative to the notes folder"
drive_letter = "drive letters are not allowed"
empty_component = "contains an empty folder or file name"
dot = "'.' is not allowed"
dot_dot = "'..' is not allowed"
hidden = "names starting with '.' are not allowed"
control_char = "contains a control character"
invalid_char = "contains a character that is not allowed"
reserved_name = "reserved name"
trailing_space = "names must not end with a space"
trailing_dot = "names must not end with a dot"
too_long = "name is too long"
outside_root = "points outside the notes folder"
invalid_type = "invalid note type"
invalid_name = "invalid note name"
must_be_string = "must be a string"
must_be_bool = "must be true or false"
must_be_positive_integer = "must be a positive integer"
must_be_fraction = "must be a number between 0 and 1"
must_be_string_array = "must be a list of strings"
must_be_type_names = "must contain only non-empty names without dots"
must_be_type_name = "must be a non-empty name without dots"
must_be_table = "must be a table"
must_not_be_empty = "must not be empty"
must_be_language = "must be one of auto, tr, en"

[config]
unknown_key = "Unknown setting '{key}' ignored"
invalid_value = "Setting '{key}' {reason}; using the default"
syntax_error = "Syntax error in the config file at line {line}, column {column}: {detail}; using all defaults"
unreadable = "Cannot read the config file '{path}'; using all defaults"
defaults_unusable = "Built-in defaults are unusable"

[tui]
query_placeholder = "query"
status = "[name] 3/3   sync off"
key_hints = "q/Esc quit  Ctrl-C quit"

[gui]
tab_notes = "Notes"
tab_settings = "Settings"
notes_placeholder = "Notes will be listed here"
settings_placeholder = "Settings will go here"
usage_export_pdf = "usage: notes-gui --export-pdf <input> <output>"
export_input_unreadable = "cannot read input: {path}: {detail}"
export_output_unopenable = "cannot open output: {path}: {detail}"
export_output_unwritable = "cannot write output: {path}: {detail}"
