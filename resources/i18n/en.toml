help_title = "Keys"
help_hints = "↑/↓ PgUp/PgDn scroll  Esc/F1/q close"
help_body = """
List
:             command palette: run by name
/             search: filter notes as you type
↑ ↓  k j      move, the right pane follows
gg G          first / last row
gh gt         root folder, trash
v             select the row, moves down
X  Ctrl+A     clear selection, select all
y             copy the selection or row
p             paste here; a taken name gets -2
m             move to a folder (input, Tab lists)
L             relate to a note (input, Tab lists)
              then a name: Tab names, ^D directed
Esc           cancel the pending y
→ l S         preview; on a folder: enter
← h           parent folder (root: nothing);
              on a search result: go to its folder
Mouse         click selects, double click enters,
              click a path segment on top to jump
Enter e       edit in the right pane
E             open in external editor ($EDITOR)
F2 r on folder rename, relative to here
F2            change path and name (below)
a ^O          new note: full-screen editor
n  name/      new folder here, stays in the list
n             new note: name atop the list
c             copy the whole note
s f           search names and content, args too
T             search by tag (Tab lists the tags)
d ^D          to trash, no question  u undo
d D on folder  ask, show counts; u undoes d
c on folder   copy its path
D             delete for good (asks first)
t             trash (see below)
Space I       row details (see below)
x             export as PDF (path below)
i             import files, folders (path below)
PgUp PgDn     move by a page in the list
o  V          sort, right column (see below)
r             move / rename / change type
^S            sync now (also in the preview)
Tab           switch name / content search
< >           pane width  z zoom pane
?             this help
q             quit
Esc           clear filter
Search (input below)
type          filter the list
↑ ↓           move the selection
Enter         keep selection (no match: new note)
^T            switch name / content search
^P ^N         previous searches matching the text
Tab           complete: one inserts, else a list
→             take the dim suggestion at the end
← → Home End  move the cursor
Esc           close the list, then the input
Inputs (n, F2, name, editor find)
→             take the dim suggestion at the end
Tab           complete: one inserts, else a list
List and search
^P ^N         move the selection (List)
PgUp PgDn     move by a page
^O new  ^R move  ^D to trash  ^S sync
Trash (t, or click trash: N on the top line)
v  Ctrl+A     select rows for u and D
u             restore the selected note
D             delete for good (asks first)
E             empty it all (asks first)
↑ ↓  k j      move, the right pane is read-only
PgUp PgDn     scroll the right pane
Esc q t       back to the list
Tree
▸ ▾           folder closed / open; click arrow
Space         folder: open in place; note: details
Row details
i             trash: open / close the selected row
I             open / close all rows
Alt+→ Alt+←   open / close
              size, dates, sync, origin
Sort and column
o             n name  u updated  c created
              s size  r reverse  Esc cancel
V             cycle the right column
Filter arguments (/ and s)
sort:-size    largest first (- reverses)
type:md       by type
in:work/      in a folder
size:>1mb     by size
updated:7d    changed in the last 7 days
sync:modified by sync state
Preview (read-only)
↑ ↓           scroll; speeds up when held
k j  J K      1 line, 5 lines
^U ^D         half a page
PgUp PgDn     scroll by page
⇧← ⇧→         raw: long lines sideways
F2            change path and name
g G           top / bottom
c             copy the whole note
R             rendered / raw view (md csv json)
P             export as PDF (path below)
e Enter       edit from the top visible line
E             external editor ($EDITOR)
/             find in note (I = ı = i)
n N           next / previous match
b             links section under the preview
p             properties of the shown note
Tab ⇧Tab      next / prev [[link]], Enter opens
L             relate to a note (input, Tab lists)
              then a name: Tab names, ^D directed
← h Esc       back to the list (Esc clears find)
q             quit
< >           pane width  z zoom pane
Links (b in the preview, or click)
↑ ↓  k j      select  PgUp PgDn by a page
Enter         open the note; click does too
L             on a related row: remove (asks)
              on any other row: relate to a note
n f u         on a related row: rename it, flip
              its direction, make it undirected
p             on a related row: its properties
Esc b         back to the preview
[[name]]      no such note; a renamed target stays
              stale here, text is not rewritten
Properties (p: preview, links, map)
↑ ↓  k j      select a row
a             add: key, then value; a #key
              adds a label to the note's text
e Enter       edit the value; text: number:
              bool: choose the type, else auto
d             delete (asks); app keys read-only
Esc p         back
Editor (right pane): all keys edit
^S save  ^Q close (asks if unsaved)
Esc closes find, clears the selection
^Z undo  ^Y redo
^Space completion popup  Tab/→ accept hint
Spell check: md, txt; needs hunspell on PATH
^F find: Enter/F3 next  ^P prev  Esc close
^X cut  ^C copy  ^V paste
No selection: the line is cut/copied
Shift+arrows select  Home End
^Home ^End  PgUp PgDn  F1 F9
^C ^X ^V use the system clipboard:
wl-copy, xclip/xsel, pbcopy, Win32;
copy falls back to OSC 52 (75 KB).
Terminal paste arrives as typing.
Map (palette view.map; view.tree returns)
← → ↑ ↓       pan  + -  zoom  0 fit
Tab ⇧Tab      select a note, Enter opens it
w t           whole graph, tags  1-9 depth
gt            trash (t is tags on the map)
/             find on the map: Enter Tab next,
              ⇧Tab previous, Esc keeps the match
:search       the list search lights its notes
x X           open/close the selected note's
              neighbours; X: one more hop
e N #         filter edges: links/relations;
              a relation name; a tag (Tab lists)
R             shortest path from the selected
              note: Tab target, d directed,
              Enter finds it, Esc clears it
P U           pin/unpin the selected, unpin all
p             properties of the selected note
              (C mode: of the relation edge)
n d u         new note here, trash the
              selected, u brings it back
Q             Cypher query: Enter runs, ↑↓
              history, Tab view names; result
              lit on the map, writes ask first
O             query result as a table: ↑↓ row,
              Enter opens its note; Esc clears
K             save the shown query as a view
C             connect from the selected note:
              Tab target, Enter connect (note:
              r related, l [[link]]; tag: adds
              it), d remove edge, Esc cancel
Right-drag    node onto node: same as C
Right click   an edge: select it, d removes
n f u         on a relation: rename, flip, make
              undirected; r asks a name (^D)
Tabs (on the right pane's top border)
^T            new tab with an empty note
^W            close the tab (asks if unsaved)
Alt+N ^PgDn   next tab
Alt+P ^PgUp   previous tab
^K            in the editor: keep the tab, search
^Q            close the tab, back to the list
: right click "Open in new tab": selected note
Mouse
Drag the divider  Wheel scrolls under pointer
Click a row or a pane
Right click a row: its menu (move, trash, …)
Click ▸ ▾: row details
Click trash: N on the top line: the trash
Drag in REVIEW selects and copies
Click a [[link]] in REVIEW: open its note
In the rendered view a drag copies what is shown
c always copies the original bytes
Shift+drag selects terminal text
Everywhere
F1 help  F9 settings (List, preview: ,)
Ctrl+L        redraw the screen
^C quit (copy in the editor)
"""
