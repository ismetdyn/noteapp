help = """
Usage:
  note [-t TYPE] [-f FOLDER] [-n NAME] [--no-sync] TEXT...   Add a note from the arguments
  ... | note [flags]                                          Add a note from stdin
  note [flags]                                                Add a note in your editor
  note -e [flags] [TEXT...]                                   Always open the editor; TEXT becomes the initial content
  note ls [QUERY] [-f FOLDER]                                 List notes
  note find TERM...                                           Search note contents
  note show QUERY                                             Print the best match
  note edit QUERY                                             Open the best match in your editor
  note rm PATH [-y]                                           Delete a note (exact path only)
  note mv SOURCE TARGET                                       Move or rename a note
  note export --pdf PATH [-o OUTPUT]                          Export a note as PDF
  note sync [status | on | off | init REMOTE [--replace] | login [HOST] | logout [HOST]]
                                                              Sync now, or manage synchronization
  note config path | list | get KEY | set KEY VALUE           Manage the configuration
  note query [--write] [--json] [--param KEY=VALUE]... CYPHER Run a Cypher query on the graph database
  note --help | help COMMAND | --version                      Show help or the version

Use 'note -- ls' to add a note whose text is a command name.

Exit codes: 0 ok, 1 user error, 2 usage error, 3 I/O or internal error, 4 sync error.
"""
