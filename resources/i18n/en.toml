help_ls = "List notes: fuzzy order with a query, newest first without; -f limits to a folder. The query takes the search arguments (tag:NAME, type:, in:, size:, updated:, created:, origin:, sync:, sort:)"
help_tags = "List the #tags of live notes with their note counts (NAME<TAB>COUNT); --json prints name, display and count"
help_import = "Import files as notes, byte for byte (BOM, CRLF and binary kept; a binary note is read-only). A folder comes in under its own name with its subfolders. The name comes from the file name, the type from the extension (--type replaces it; no extension: detected from the content). A taken name gets -2, -3; --overwrite replaces that note instead. --name names a single PATH. Links are not followed, hidden entries inside folders are left out, the original files are never changed. Exit 1 if anything was skipped or not imported"
help_view = "Saved Cypher views: save a read-only query under a name (--force replaces), list them (NAME<TAB>QUERY), run one with the note query output, remove or print one. Views sync like notes; a query that writes is refused on save and on run. view:NAME in a search filters notes to the ones the view returns"
help_relation = "Named relations between notes (RELATED_TO). add relates A to B: unnamed and undirected by default, --name names it, --directed points it from A to B. A pair has at most one relation per name and one unnamed. rm removes the pair's only relation, or the one picked by --name (empty: unnamed) or --id; rename renames the relation called OLD (empty: unnamed) to NEW (empty: unnamed). ls lists the names with their counts (NAME<TAB>COUNT); ls NOTE lists the note's relations (PATH<TAB>NAME<TAB>DIRECTION<TAB>ID). Names from other devices are shown without control or hidden characters"
help_find = "Search note contents (all terms must appear); prints path:line: snippet. On a terminal, with -l or --json, notes whose tag, relation name or linked note matches follow with the reason (plain piped output lists content only); --limit N caps the notes shown"
help_show = "Print the best match (an exact path wins; the chosen path goes to stderr)"
help_edit = "Open the best match in your editor"
help_rm = "Delete a note (exact path only); asks for confirmation, -y is required outside a terminal"
help_mv = "Move or rename a note; a changed extension changes the type; folders are created"
help_export = "Export a note as PDF, or every note into a folder as plain files, byte for byte"
help_sync = "Sync now, or manage synchronization; login reads the access token from stdin without echo and saves it in the system keychain"
help_query = "Run a Cypher query on the graph database (read-only unless --write); prints a table or JSON"
