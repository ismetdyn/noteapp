help_title = "Keys"
help_hints = "↑/↓ PgUp/PgDn scroll  Esc/F1/q close"
help_body = """
List
/             search: filter notes as you type
↑ ↓  k j      move, the right pane follows
gg G          first / last row
gh gt         root folder, trash
x             select the row, moves down
X  Ctrl+A     clear selection, select all
y             copy the selection or row
p             paste here; a taken name gets -2
m             move to a folder (input, Tab lists)
Esc           cancel the pending y
→ l           preview; on a folder: enter
← h           parent folder (root: nothing);
              on a search result: go to its folder
Mouse         click selects, double click enters,
              click a path segment on top to jump
Enter e       edit in the right pane
E             open in external editor ($EDITOR)
F2 r on folder rename, relative to here
F2            change path and name (below)
n ^O          new note: full-screen editor
a  name/      new folder here, stays in the list
a             new note: name atop the list
c             copy the whole note
f             search names and content, args too
d ^D          to trash, no question  u undo
d D on folder  ask, show counts; u undoes d
c on folder   copy its path
D             delete for good (asks first)
T             trash (see below)
Space i I     row details (see below)
PgUp PgDn     move by a page in the list
o  v          sort, right column (see below)
r             move / rename / change type
s             sync now
Tab           switch name / content search
< >           pane width  z zoom pane
?             this help
q             quit
Esc           clear filter
Search (input below)
type          filter the list
↑ ↓           move the selection
Enter         keep selection (no match: new note)
^T            switch name / content search
^P ^N         previous searches matching the text
Tab           complete: one inserts, else a list
→             take the dim suggestion at the end
← → Home End  move the cursor
Esc           close the list, then the input
Inputs (a, F2, name, editor find)
→             take the dim suggestion at the end
Tab           complete: one inserts, else a list
List and search
^P ^N         move the selection (List)
PgUp PgDn     move by a page
^O new  ^R move  ^D to trash  ^S sync
Trash (T, or click trash: N on the top line)
x  Ctrl+A     select rows for u and D
u             restore the selected note
D             delete for good (asks first)
E             empty it all (asks first)
↑ ↓  k j      move, the right pane is read-only
PgUp PgDn     scroll the right pane
Esc q T       back to the list
Tree
▸ ▾           folder closed / open; click arrow
Space         folder: open in place; note: details
Row details
i             open / close the selected row
I             open / close all rows
Alt+→ Alt+←   open / close
              size, dates, sync, origin
Sort and column
o             n name  u updated  c created
              s size  r reverse  Esc cancel
v             cycle the right column
Filter arguments (/ and f)
sort:-size    largest first (- reverses)
type:md       by type
in:work/      in a folder
size:>1mb     by size
updated:7d    changed in the last 7 days
sync:modified by sync state
Preview (read-only)
↑ ↓           scroll; speeds up when held
k j  J K      1 line, 5 lines
^U ^D         half a page
PgUp PgDn     scroll by page
F2            change path and name
g G           top / bottom
c             copy the whole note
R             rendered / raw view (md csv json)
e Enter       edit from the top visible line
E             external editor ($EDITOR)
/             find in note (I = ı = i)
n N           next / previous match
← h Esc       back to the list (Esc clears find)
q             quit
< >           pane width  z zoom pane
Editor (right pane): all keys edit
^S save  ^Q close (asks if unsaved)
Esc closes find, clears the selection
^Z undo  ^Y redo
^Space completion popup  Tab/→ accept hint
Spell check: md, txt; needs hunspell on PATH
^F find: Enter/F3 next  ^P prev  Esc close
^X cut  ^C copy  ^V paste
No selection: the line is cut/copied
Shift+arrows select  Home End
^Home ^End  PgUp PgDn  F1 F9
^C ^X ^V use the system clipboard:
wl-copy, xclip/xsel, pbcopy, Win32;
copy falls back to OSC 52 (75 KB).
Terminal paste arrives as typing.
Mouse
Drag the divider  Wheel scrolls under pointer
Click a row or a pane
Click ▸ ▾: row details
Click trash: N on the top line: the trash
Drag in REVIEW selects and copies
In the rendered view a drag copies what is shown
c always copies the original bytes
Shift+drag selects terminal text
Everywhere
F1 help  F9 settings (List, preview: ,)
Ctrl+L        redraw the screen
^C quit (copy in the editor)
"""
