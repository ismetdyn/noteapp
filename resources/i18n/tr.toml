help_title = "Tuşlar"
help_hints = "↑/↓ PgUp/PgDn kaydır  Esc/F1/q kapat"
help_body = """
Liste
:             komut paleti: adıyla çalıştır
/             ara: yazdıkça notları süz
↑ ↓  k j      gezin, sağ panel izler
gg G          ilk / son satır
gh gt         kök klasör, çöp
x             satırı seç, aşağı in
X  Ctrl+A     seçimi temizle, görünenleri seç
y             seçimi ya da satırı kopyala
p             buraya yapıştır; dolu ada -2
m             klasöre taşı (girdi, Tab listeler)
L             nota bağla (girdi, Tab listeler)
Esc           bekleyen y'den vazgeç
→ l           önizle; klasörde içeri gir
← h           üst klasör (kökte etkisiz);
              arama sonucunda notun klasörüne git
Fare          tıklama seçer, çift tıklama girer,
              üstteki yol parçasına tıklama atlar
Enter e       sağ panelde düzenle
E             harici editörde aç ($EDITOR)
F2 r klasörde ad değiştir, buradan göreli
F2            yol ve adı değiştir (altta)
n ^O          yeni not: tam ekran editör
a  ad/        burada yeni klasör, Listede kalır
a             yeni not: ad listenin başında
c             notun tamamını kopyala
f             ad ve içerikte ara, argümanlar da
d ^D          çöpe at, sormaz  u geri al
d D klasörde  sorar, sayıları söyler; u d'yi alır
c klasörde    yolunu kopyala
D             kalıcı sil (önce sorar)
T             çöp kutusu (aşağıda)
Space i I     satır ayrıntısı (aşağıda)
PgUp PgDn     listede sayfa sayfa gez
o  v          sıralama, sağ sütun (aşağıda)
r             taşı / ad ya da tip değiştir
s             şimdi senkronla
Tab           ad / içerik araması
< >           panel genişliği  z yakınlaştır
?             bu yardım
q             çık
Esc           süzgeci temizle
Arama (girdi altta)
yazı          listeyi süz
↑ ↓           seçimi gez
Enter         seçimi tut (eşleşme yoksa yeni not)
^T            ad / içerik araması
^P ^N         metni içeren önceki aramalar
Tab           tamamla: tekse yazar, yoksa liste
→             sondaki soluk öneriyi alır
← → Home End  imleci oynatır
Esc           önce listeyi, sonra girdiyi kapatır
Girdiler (a, F2, ad, editörde bul)
→             sondaki soluk öneriyi alır
Tab           tamamla: tekse yazar, yoksa liste
Liste ve arama
^P ^N         seçimi gez (Liste)
PgUp PgDn     sayfa sayfa gez
^O yeni  ^R taşı  ^D çöpe at  ^S senkron
Çöp kutusu (T ya da üstte çöp: N tıkla)
x  Ctrl+A     u ve D için satır seç
u             seçili notu geri getir
D             kalıcı sil (önce sorar)
E             tümünü boşalt (önce sorar)
↑ ↓  k j      gez, sağda içerik salt okunur
PgUp PgDn     sağ paneli kaydır
Esc q T       listeye dön
Ağaç
▸ ▾           klasör kapalı / açık; oka tıkla
Space         klasör: yerinde aç; not: ayrıntı
Satır ayrıntısı
i             seçili satırı aç / kapat
I             tüm satırları aç / kapat
Alt+→ Alt+←   aç / kapat
              boyut, tarih, senkron, kaynak
Sıralama ve sütun
o             n ad  u güncelleme  c oluşturma
              s boyut  r ters  Esc vazgeç
v             sağ sütunu sırayla değiştir
Süzme argümanları (/ ve f)
sort:-size    büyükten küçüğe (- ters çevirir)
type:md       tipe göre
in:work/      klasörde
size:>1mb     boyuta göre
updated:7d    son 7 günde değişen
sync:modified senkron durumuna göre
Önizleme (salt okunur)
↑ ↓           kaydır; basılı tutunca hızlanır
k j  J K      1 satır, 5 satır
^U ^D         yarım sayfa
PgUp PgDn     sayfa sayfa kaydır
F2            yol ve adı değiştir
g G           baş / son
c             notun tamamını kopyala
R             biçimli / ham görünüm (md csv json)
e Enter       üstteki satırdan düzenle
E             harici editör ($EDITOR)
/             notta bul (I = ı = i)
n N           sonraki / önceki eşleşme
b             önizleme altındaki bağlantılar
L             nota bağla (girdi, Tab listeler)
← h Esc       listeye dön (Esc önce aramayı siler)
q             çık
< >           panel genişliği  z yakınlaştır
Bağlantılar (önizlemede b ya da tıklama)
↑ ↓  k j      seç  PgUp PgDn sayfa sayfa
Enter         nota git; tıklama da gider
L             ilişkili satırda: kaldır (sorar)
              diğer satırda: nota bağla
Esc b         önizlemeye dön
[[ad]]        böyle not yok; adı değişen hedef
              eski kalır, metin yeniden yazılmaz
Editör (sağ panel): her tuş metne gider
^S kaydet  ^Q kapat (kaydedilmediyse sorar)
Esc aramayı kapatır, seçimi kaldırır
^Z geri  ^Y yinele
^Space tamamlama listesi  Tab/→ öneriyi al
Yazım denetimi: md, txt; PATH'te hunspell gerekir
^F bul: Enter/F3 sonraki  ^P önceki  Esc kapat
^X kes  ^C kopyala  ^V yapıştır
Seçim yoksa satır kesilir/kopyalanır
Shift+ok seç  Home End
^Home ^End  PgUp PgDn  F1 F9
^C ^X ^V sistem panosunu kullanır:
wl-copy, xclip/xsel, pbcopy, Win32;
kopyada yedek OSC 52 (75 KB).
Terminalden yapıştırma yazar gibi gelir.
Fare
Bölücüyü sürükle: panel genişliği
Tekerlek: işaretçinin altını kaydırır
Satıra ya da panele tıkla
▸ ▾ tıkla: satır ayrıntısı
Üstte çöp: N tıkla: çöp kutusu
