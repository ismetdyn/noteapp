help_title = "Tuşlar"
help_hints = "↑/↓ PgUp/PgDn kaydır  Esc/F1/q kapat"
help_body = """
Liste
:             komut paleti: adıyla çalıştır
/             ara: yazdıkça notları süz
↑ ↓  k j      gezin, sağ panel izler
gg G          ilk / son satır
gh gt         kök klasör, çöp
v             satırı seç, aşağı in
X  Ctrl+A     seçimi temizle, görünenleri seç
y             seçimi ya da satırı kopyala
p             buraya yapıştır; dolu ada -2
m             klasöre taşı (girdi, Tab listeler)
L             nota bağla (girdi, Tab listeler)
              sonra adı: Tab adlar, ^D yönlü
Esc           bekleyen y'den vazgeç
→ l S         önizle; klasörde içeri gir
← h           üst klasör (kökte etkisiz);
              arama sonucunda notun klasörüne git
Fare          tıklama seçer, çift tıklama girer,
              üstteki yol parçasına tıklama atlar
Enter e       sağ panelde düzenle
E             harici editörde aç ($EDITOR)
F2 r klasörde ad değiştir, buradan göreli
F2            yol ve adı değiştir (altta)
a ^O          yeni not: tam ekran editör
n  ad/        burada yeni klasör, Listede kalır
n             yeni not: ad listenin başında
c             notun tamamını kopyala
s f           ad ve içerikte ara, argümanlar da
T             etikete göre ara (Tab listeler)
d ^D          çöpe at, sormaz  u geri al
d D klasörde  sorar, sayıları söyler; u d'yi alır
c klasörde    yolunu kopyala
D             kalıcı sil (önce sorar)
t             çöp kutusu (aşağıda)
Space I       satır ayrıntısı (aşağıda)
x             PDF olarak dışa aktar (yol altta)
i             dosya ve klasör içe al (yol altta)
PgUp PgDn     listede sayfa sayfa gez
o  V          sıralama, sağ sütun (aşağıda)
r             taşı / ad ya da tip değiştir
^S            şimdi senkronla (önizlemede de)
Tab           ad / içerik araması
< >           panel genişliği  z yakınlaştır
?             bu yardım
q             çık
