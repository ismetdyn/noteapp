help_import = "Dosyaları bayt bayt not olarak içe alır (BOM, CRLF ve ikili korunur; ikili not salt okunurdur). Klasör kendi adıyla, alt klasörleriyle gelir. Ad dosya adından, tip uzantıdan gelir (--type yerine geçer; uzantı yoksa içerikten tespit). Dolu ad -2, -3 alır; --overwrite bunun yerine o notun üzerine yazar. --name tek YOL'u adlandırır. Bağlar izlenmez, klasör içindeki gizli girdiler dışarıda kalır, özgün dosyalar hiç değişmez. Atlanan ya da alınamayan varsa çıkış 1"
