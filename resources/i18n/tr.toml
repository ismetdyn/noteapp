help_ls = "Notları listeler: sorguyla fuzzy sırada, sorgusuz en yeniden eskiye; -f klasörle sınırlar. Sorgu arama argümanlarını alır (tag:AD, type:, in:, size:, updated:, created:, origin:, sync:, sort:)"
help_tags = "Canlı notların #etiketlerini not sayılarıyla listeler (AD<TAB>SAYI); --json ad, gösterim ve sayı yazar"
help_import = "Dosyaları bayt bayt not olarak içe alır (BOM, CRLF ve ikili korunur; ikili not salt okunurdur). Klasör kendi adıyla, alt klasörleriyle gelir. Ad dosya adından, tip uzantıdan gelir (--type yerine geçer; uzantı yoksa içerikten tespit). Dolu ad -2, -3 alır; --overwrite bunun yerine o notun üzerine yazar. --name tek YOL'u adlandırır. Bağlar izlenmez, klasör içindeki gizli girdiler dışarıda kalır, özgün dosyalar hiç değişmez. Atlanan ya da alınamayan varsa çıkış 1"
help_view = "Kayıtlı Cypher görünümleri: salt okunur sorguyu adla kaydet (--force değiştirir), listele (AD<TAB>SORGU), note query çıktısıyla çalıştır, sil ya da yazdır. Görünümler notlar gibi senkronlanır; yazan sorgu kayıtta da çalıştırmada da reddedilir. Aramada view:AD notları görünümün döndürdüklerine süzer"
help_relation = "Notlar arası adlı ilişkiler (RELATED_TO). add A ile B'yi ilişkilendirir: varsayılan adsız ve yönsüz, --name ad verir, --directed A'dan B'ye yönlendirir. Bir çiftte ad başına en çok bir ilişki ve bir adsız ilişki olur. rm çiftin tek ilişkisini ya da --name (boş: adsız) veya --id ile seçileni kaldırır; rename ESKİ adlı ilişkiyi (boş: adsız) YENİ ada (boş: adsız) çevirir. ls adları sayılarıyla (AD<TAB>SAYI), ls NOT notun ilişkilerini (YOL<TAB>AD<TAB>YÖN<TAB>KİMLİK) listeler. Başka cihazdan gelen adlar denetim ve görünmez karakter olmadan yazılır"
help_find = "Not içeriklerinde arar (tüm terimler geçmeli); yol:satır: kesit yazar. Terminalde, -l ya da --json ile etiketi, ilişki adı ya da bağlı notu eşleşen notlar ardından nedenleriyle gelir (düz boru çıktısı yalnız içerik); --limit N gösterilen not sayısını sınırlar"
