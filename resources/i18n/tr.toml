not_implemented = "'{command}' komutu henüz kullanılamıyor"
help = """
Kullanım:
  note [-t TİP] [-f KLASÖR] [-n AD] [--no-sync] METİN...   Argümanlardan not ekler
  ... | note [bayraklar]                                    stdin'den not ekler
  note [bayraklar]                                          Editörde not ekler
  note ls [SORGU] [-f KLASÖR]                               Notları listeler
  note find TERİM...                                        Not içeriklerinde arar
  note show SORGU                                           En iyi eşleşmeyi yazdırır
  note edit SORGU                                           En iyi eşleşmeyi editörde açar
  note rm YOL [-y]                                          Notu siler (yalnız tam yol)
  note mv KAYNAK HEDEF                                      Notu taşır veya yeniden adlandırır
  note export --pdf YOL [-o ÇIKTI]                          Notu PDF olarak dışa aktarır
  note sync [status | on | off | init REMOTE | login [HOST] | logout [HOST]]
                                                            Senkronu yönetir
  note config path | list | get ANAHTAR | set ANAHTAR DEĞER Ayarları yönetir
  note --help | help KOMUT | --version                      Yardımı veya sürümü gösterir

Komut adıyla aynı metni not etmek için: 'note -- ls'.

Çıkış kodları: 0 başarı, 1 kullanıcı kaynaklı, 2 kullanım hatası, 3 G/Ç veya iç hata, 4 senkron hatası.
"""

[sync]
commit_message = "{host} cihazından senkron, {time} (değişen dosya: {count})"
